# SwiftLint configuration: https://realm.github.io/SwiftLint/rule-directory.html

included:
  - VideoPlayer

# Match the 80-column line length that swift-format wraps to.
line_length:
  warning: 80

# swift-format puts the opening brace on its own line when a declaration or
# condition wraps, so allow that.
opening_brace:
  ignore_multiline_type_headers: true
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true

# Allow names of any length, such as `x`, `dx`, or `a`.
identifier_name:
  min_length:
    warning: 1
    error: 1
